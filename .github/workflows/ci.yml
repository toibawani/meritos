name: MeritOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, zero errors)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run Cryptographic & Schema Test Suite
        run: npm test

      - name: Coverage (real lib numbers, printed)
        run: npm run test:coverage

      - name: Build Next.js Production App
        run: npm run build

  e2e:
    # Smoke-test the shipped app: Playwright drives `next build && next start`
    # (see playwright.config.ts webServer) against the highest-value routes.
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: test-and-build
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7
